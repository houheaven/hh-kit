
# ==========================================================
# 发布到 npm
# ----------------------------------------------------------
# 触发方式：
# - 推送 tag：kit-vue.v0.x.x 发布 packages/kit-vue
# - 推送 tag：kit-vue2.v0.x.x 发布 packages/kit-vue2
# - 推送 tag：kit-react.v0.x.x 发布 packages/kit-react
# - 手动触发：在 Actions 页面选择要发布的包（默认只演练，不真正发布）
#
# 认证方式：npm Trusted Publishing（OIDC），无需配置 NPM_TOKEN
# - 需要先在 npmjs.com 的包设置中，将本仓库 + npm-publish.yml 登记为 Trusted Publisher
# ==========================================================

name: Npm 发布工作流
run-name: Npm 发布工作流

on:
  push:
    tags:
      - "kit-vue.v*"
      - "kit-vue2.v*"
      - "kit-react.v*"
  workflow_dispatch:
    inputs:
      package:
        description: "要发布的包"
        type: choice
        required: true
        default: kit-vue
        options:
          - kit-vue
          - kit-vue2
          - kit-react
      dry-run:
        description: "只演练，不真正发布"
        type: boolean
        default: true

# 同一时间只允许一个发布任务，且不中断进行中的发布
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # Trusted Publishing（OIDC）必需

jobs:
  publish:
    name: 发布到 Npm
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 配置 pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          # version: 12.11.2     # pnpm 版本，如果 package.json 中没有指定 packageManager，可以在此处开启
          require-lockfile: true
          cache: true

      # 根据 tag 或手动输入，确定要发布的包目录
      - name: 解析包（确认发包正确有效）
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}          # 触发事件类型，push 或 workflow_dispatch
          REF_NAME: ${{ github.ref_name }}              # 触发事件的 ref 名，如 tag 名、分支名
          INPUT_PACKAGE: ${{ inputs.package }}          # 手动触发的包，如 kit-vue、kit-vue2、kit-react
        run: |
          # 调试信息
          # echo "$EVENT_NAME";
          # echo "$REF_NAME";
          # echo "$INPUT_PACKAGE";

          if [ "$EVENT_NAME" = "push" ]; then
            case "$REF_NAME" in
              kit-vue.v*) package="kit-vue" ;;
              kit-vue2.v*) package="kit-vue2" ;;
              kit-react.v*) package="kit-react" ;;
              *) echo "::error::无法识别的 tag：$REF_NAME"; exit 1 ;;
            esac
          else
            # 手动触发（workflow_dispatch）
            package="$INPUT_PACKAGE"
          fi

          dir="packages/$package"
          version="$(node -p "require('./$dir/package.json').version")"

          # tag 触发时，tag 必须与 package.json 的版本号一致
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" != "$package.v$version" ]; then
            echo "::error::tag（$REF_NAME）与期望值（$package.v$version）不一致，请核对 $dir/package.json 的版本号"
            exit 1
          fi

          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "========================================"
          echo "发布包名：@houheaven/$package@$version"
          echo "发布目录：$dir"
          echo "========================================"

      # 已发布过的版本直接报错，避免 npm publish 阶段才失败
      - name: 检查版本是否已发布
        env:
          PACKAGE: ${{ steps.target.outputs.package }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          package="@houheaven/$PACKAGE"
          if npm view $package@$VERSION version > /dev/null 2>&1; then
            echo "::error::Npm 平台已存在 $package 此版本号 v$VERSION，请先更新版本号"
            exit 1
          fi

      - name: 发布到 npm
        working-directory: ${{ steps.target.outputs.dir }}
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi
